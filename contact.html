<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | The Cafe Library, Vapi</title><meta name="description" content="Address, opening hours and directions for The Cafe Library in Vapi.">
<link rel="icon" href="images/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<header id="site-header"></header><main>
<section class="wrap info"><div><h1>Visit us</h1><dl><dt>Address</dt><dd data-cfg="address"></dd><dt>Phone</dt><dd data-cfg="phone"></dd></dl>
<h2 style="font-size:1.4rem">Opening hours</h2><dl id="hours"></dl><a class="btn directions" href="#">Get directions</a>
<iframe id="map" title="Map showing The Cafe Library in Vapi" loading="lazy"></iframe></div>
<div><h2>Send a message</h2><p class="lead">This opens WhatsApp with your message ready to send.</p>
<form id="msg-form"><label>Your name<input name="name" required autocomplete="name"></label><label>Phone<input name="phone" type="tel" required autocomplete="tel"></label>
<label>Message<textarea name="message" rows="5" required></textarea></label><button class="btn" type="submit">Send on WhatsApp</button></form></div></section>
</main><footer id="site-footer"></footer><script src="js/main.js"></script></body></html>
