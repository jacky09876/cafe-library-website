<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order | The Cafe Library, Vapi</title><meta name="description" content="Order food and drinks from The Cafe Library and pay with UPI or cash.">
<link rel="icon" href="images/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<header id="site-header"></header><main>
<section class="wrap info"><div><h1>Your order</h1><div id="cart" style="margin-top:1.2rem"></div><p class="total"><span>Total</span><b id="total">₹0</b></p></div>
<div><h2>Your details</h2><div id="done" hidden></div><p id="err" role="alert" style="color:var(--amber);font-weight:700;margin-top:1rem"></p><form id="order-form"><label>Name<input name="name" required autocomplete="name"></label><label>Phone<input name="phone" type="tel" required autocomplete="tel"></label>
<label>How will you have it?<select name="type"><option>Dine-in</option><option>Takeaway</option></select></label><label>Table number (for dine-in)<input name="table" inputmode="numeric" maxlength="6"></label><label>Note (no sugar, extra spicy, etc.)<textarea name="note" rows="3"></textarea></label>
<p class="note">Enjoy your meal first. You pay the bill at the cafe counter by UPI, cash or card.</p>
<button class="btn" type="submit">Place order</button></form></div></section>
</main><footer id="site-footer"></footer><script src="js/main.js"></script></body></html>
